<!DOCTYPE html>
<html>
<head>
    <title>Bird Language Acoustic Converter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #121212; color: #cccccc; font-family: monospace; text-align: center; padding: 20px; }
        .lang-container { max-width: 500px; margin: 0 auto 10px auto; display: flex; justify-content: flex-end; }
        .lang-switch { display: flex; border: 1px solid #333; border-radius: 4px; overflow: hidden; background: #1a1a1a; }
        .lang-btn { background: none; border: none; color: #666; padding: 6px 12px; cursor: pointer; font-family: monospace; font-weight: bold; transition: all 0.2s; }
        .lang-btn.active { background: #00adb5; color: #fff; }
        .section { background: #1a1a1a; border: 1px solid #333; padding: 20px; border-radius: 8px; max-width: 500px; margin: 20px auto; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        input[type="text"], select { font-size: 16px; padding: 10px; width: 85%; text-align: center; background: #222; color: #fff; border: 1px solid #00adb5; border-radius: 4px; font-family: monospace; }
        select { width: 90%; margin-bottom: 10px; cursor: pointer; }
        input[type="file"] { margin: 15px 0; color: #ccc; }
        button { font-size: 16px; padding: 12px 24px; margin-top: 15px; background: #00adb5; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; transition: background 0.2s; font-family: monospace; }
        button:active { background: #007a80; }
        button:disabled { background: #555; cursor: not-allowed; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 15px auto; }
        .key { background: #222; border: 1px solid #444; padding: 10px 4px; font-size: 14px; color: #00adb5; cursor: pointer; font-weight: bold; border-radius: 4px; user-select: none; transition: all 0.15s; }
        .key:active { background: #00adb5; color: #fff; }
        .key.inactive { opacity: 0.25; pointer-events: none; border-style: dashed; }
        .key span { display: block; font-size: 10px; color: #888; margin-top: 3px; }
        #statusMessage { margin-top: 15px; color: #00adb5; font-weight: bold; height: 20px; }
        audio { width: 100%; margin-top: 15px; outline: none; }

        .radio-group { background: #222; padding: 12px 15px; border-radius: 4px; text-align: left; margin: 12px 0; border: 1px solid #444; }
        .radio-group label { display: block; margin-bottom: 8px; cursor: pointer; font-size: 14px; }
        .radio-group label:last-child { margin-bottom: 0; }
        .radio-group input[type="radio"] { margin-right: 10px; accent-color: #00adb5; }

        /* Fullscreen styles for the spectrometer wrapper */
        #spectroWrapper:fullscreen { height: 100vh !important; border: none; border-radius: 0; max-width: 100%; margin: 0; }
        #spectroWrapper:-webkit-full-screen { height: 100vh !important; border: none; border-radius: 0; max-width: 100%; margin: 0; }
    </style>
</head>
<body>
    <!-- LANGUAGE SWITCHER -->
    <div class="lang-container">
        <div class="lang-switch">
            <button onclick="setLanguage('en')" id="lang-en" class="lang-btn active">EN</button>
            <button onclick="setLanguage('ro')" id="lang-ro" class="lang-btn">RO</button>
        </div>
    </div>

    <h2 data-translate="titleMain">Bird Language Sound Converter</h2>

    <!-- TEXT TO HEX CONVERTER -->
    <div class="section">
        <p data-translate="titleConverter">Text to Bird-Code (Hex) Converter</p>
        <input type="text" id="plainTextInput" placeholder="Enter normal text here (e.g. Hello)" data-placeholder="inputPlaceholder">
        <button onclick="convertToHex()" data-translate="btnConvert">CONVERT TO HEX</button>
    </div>

    <!-- BIRD TRANSMITTER -->
    <div class="section">
        <p data-translate="titleSpecies">Select Bird Species & Mode</p>
        <select id="speciesSelect" onchange="updateSpeciesUI()">
            <option value="blackbird">Eurasian Blackbird (1.8 - 3.3 kHz)</option>
            <option value="canary" selected>Canary (3.0 - 4.95 kHz)</option>
            <option value="greattit">Great Tit (3.9 - 6.15 kHz)</option>
            <option value="goldcrest">Goldcrest (5.2 - 7.9 kHz)</option>
        </select>

        <div class="radio-group">
            <label>
                <input type="radio" name="modMode" value="16fsk" onchange="updateSpeciesUI()">
                <span data-translate="modMode16">16-FSK Quiet Room (16 Notes - Ultra Fast & Melodic)</span>
            </label>
            <label>
                <input type="radio" name="modMode" value="4fsk" checked onchange="updateSpeciesUI()">
                <span data-translate="modMode4">4-FSK Bird Song (4 Notes - Balanced)</span>
            </label>
            <label>
                <input type="radio" name="modMode" value="2fsk" onchange="updateSpeciesUI()">
                <span data-translate="modMode2">2-FSK Fallback (2 Notes - Noise Resistant)</span>
            </label>
        </div>

        <p data-translate="titleTransmitter">Hex Code to Sing</p>
        <input type="text" id="hexInput" placeholder="4849" data-placeholder="hexPlaceholder" value="4849">
        <button onclick="transmitInput()" data-translate="btnTransmit">SING MESSAGE</button>

        <p style="margin-top: 15px; margin-bottom: 5px; font-size: 13px; color: #999;" data-translate="padLabel">Tap to test individual bird notes:</p>
        <div class="grid" id="noteGrid"></div>
        <p id="notesLabel" style="font-size: 12px; color: #777;"></p>

        <!-- SIGNAL OSCILLOSCOPE -->
        <p style="margin-top: 15px; font-size: 14px;" data-translate="titleOscilloscope">Signal Oscilloscope</p>
        <canvas id="oscCanvas" width="500" height="100" style="width:100%; height:100px; background:#000; border: 1px solid #333; border-radius: 4px; display: block; margin: 0 auto;"></canvas>
    </div>

    <!-- IMAGE TO SPECTROGRAM -->
    <div class="section">
        <p data-translate="titleUpload">Upload Image for Spectrogram Audio</p>

        <div class="radio-group">
            <label>
                <input type="radio" name="txMode" value="phone" checked>
                <span data-translate="txModePhone">Phone to Phone Mode (Fast)</span>
            </label>
            <label>
                <input type="radio" name="txMode" value="pc">
                <span data-translate="txModePC">Presentation Mode (High Quality)</span>
            </label>
        </div>

        <input type="file" id="imageInput" accept="image/png, image/jpeg">
        <button id="uploadBtn" onclick="uploadImage()" data-translate="btnUpload">TRANSMIT IMAGE</button>
        <div id="statusMessage"></div>
        <audio id="audioPlayer" controls style="display: none;"></audio>
    </div>

    <!-- LIVE SPECTROMETER -->
    <div class="section">
        <p data-translate="titleSpectrometer">Live Mobile Spectrometer</p>

        <div id="spectroWrapper" style="position: relative; width: 100%; height: 200px; background: #000; border: 1px solid #333; border-radius: 4px; overflow: hidden; margin: 0 auto;">
            <canvas id="spectroCanvas" width="300" height="128" style="width: 100%; height: 100%; display: block;"></canvas>
            <div id="freqScale" style="position: absolute; right: 0; top: 0; bottom: 0; width: 45px; background: rgba(0,0,0,0.7); color: #00adb5; font-size: 10px; font-weight: bold; display: none; flex-direction: column; justify-content: space-between; padding: 5px; text-align: right; pointer-events: none; border-left: 1px solid #333;"></div>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button id="btnSpectro" onclick="toggleSpectrometer()" data-translate="btnStartSpectro" style="margin-top: 0;">START</button>
            <button onclick="toggleFullscreen()" data-translate="btnFullscreen" style="margin-top: 0; width: 40%; background: #444;">FULLSCREEN</button>
        </div>
    </div>

    <script>
        let currentLang = "en";

        // --- SHARED BIRD SPECIES PROFILES (Must match ui.py) ---
        const SPECIES_PROFILES = {
            blackbird: {
                nameEn: "Eurasian Blackbird (1.8 - 3.3 kHz)",
                nameRo: "Mierlă (1.8 - 3.3 kHz)",
                freqs4: [1800, 2300, 2800, 3300],
                syncFreq: 1500,       // Safely below f0 (1800Hz) and above HP (1200Hz)
                toneDur: 0.22,
                gapDur: 0.10,
                charGap: 0.38,
                gap16: 0.16,
                scoopDur: 0.035,
                scoopRatio: 0.86,     // Warm upward flute whistle
                vibratoRate: 14,
                vibratoDepth: 18,
                harmonicGain: 0.12
            },
            canary: {
                nameEn: "Canary (3.0 - 4.95 kHz)",
                nameRo: "Canar (3.0 - 4.95 kHz)",
                freqs4: [3000, 3650, 4300, 4950],
                syncFreq: 2600,       // Safely below f0 (3000Hz) and above HP (2200Hz)
                toneDur: 0.18,
                gapDur: 0.08,
                charGap: 0.35,
                gap16: 0.16,
                scoopDur: 0.025,
                scoopRatio: 0.90,     // Bright chirp attack
                vibratoRate: 32,
                vibratoDepth: 30,     // Signature canary trill
                harmonicGain: 0.06
            },
            greattit: {
                nameEn: "Great Tit (3.9 - 6.15 kHz)",
                nameRo: "Pițigoi Mare (3.9 - 6.15 kHz)",
                freqs4: [3900, 4650, 5400, 6150],
                syncFreq: 3450,       // Safely below f0 (3900Hz) and above HP (3000Hz)
                toneDur: 0.16,
                gapDur: 0.09,
                charGap: 0.35,
                gap16: 0.16,
                scoopDur: 0.020,
                scoopRatio: 1.07,     // Snappy downward staccato attack
                vibratoRate: 0,
                vibratoDepth: 0,
                harmonicGain: 0.04
            },
            goldcrest: {
                nameEn: "Goldcrest (5.2 - 7.9 kHz)",
                nameRo: "Aușel (5.2 - 7.9 kHz)",
                freqs4: [5200, 6100, 7000, 7900],
                syncFreq: 4700,       // Safely below f0 (5200Hz) and above HP (4200Hz)
                toneDur: 0.16,
                gapDur: 0.08,
                charGap: 0.34,
                gap16: 0.16,
                scoopDur: 0.020,
                scoopRatio: 0.93,     // Delicate high tweet
                vibratoRate: 24,
                vibratoDepth: 25,
                harmonicGain: 0.0
            }
        };

        const translations = {
            en: {
                titleMain: "Bird Language Sound Converter",
                titleConverter: "Text to Bird-Code (Hex) Converter",
                inputPlaceholder: "Enter normal text here (e.g. Hello)",
                btnConvert: "CONVERT TO HEX",
                titleSpecies: "Select Bird Species & Mode",
                modMode16: "16-FSK Quiet Room (16 Notes - Ultra Fast & Melodic)",
                modMode4: "4-FSK Bird Song (4 Notes - Balanced)",
                modMode2: "2-FSK Fallback (2 Notes - Noise Resistant)",
                titleTransmitter: "Hex Code to Sing",
                hexPlaceholder: "Try typing 4849",
                btnTransmit: "SING MESSAGE",
                padLabel: "Tap to test individual bird notes:",
                titleOscilloscope: "Signal Oscilloscope",
                titleUpload: "Upload Image for Spectrogram Audio",
                txModePhone: "Phone to Phone Mode (Fast)",
                txModePC: "Presentation Mode (High Quality)",
                btnUpload: "TRANSMIT IMAGE",
                alertNoFile: "Please select an image first!",
                statusReady: "Ready!",
                statusProcessingPhone: "Processing locally... (Fast Mode)",
                statusProcessingPC: "Processing locally... (High Quality Mode - May take a moment)",
                titleSpectrometer: "Live Mobile Spectrometer",
                btnStartSpectro: "START",
                btnStopSpectro: "STOP",
                btnFullscreen: "FULLSCREEN",
                errMic: "Microphone access denied or unavailable."
            },
            ro: {
                titleMain: "Convertor Limbaj de Păsări",
                titleConverter: "Convertor Text în Cod Pasăre (Hex)",
                inputPlaceholder: "Introdu text normal aici (ex. Salut)",
                btnConvert: "CONVERTEȘTE ÎN HEX",
                titleSpecies: "Alege Specia de Pasăre și Modul",
                modMode16: "16-FSK Cameră Liniștită (16 Note - Ultra Rapid & Melodic)",
                modMode4: "4-FSK Cântec (4 Note - Echilibrat)",
                modMode2: "2-FSK Rezervă (2 Note - Rezistent la Zgomot)",
                titleTransmitter: "Cod Hex de Cântat",
                hexPlaceholder: "Încearcă să scrii 4849",
                btnTransmit: "CÂNTĂ MESAJUL",
                padLabel: "Apasă pentru a testa notele păsării:",
                titleOscilloscope: "Osciloscop Semnal",
                titleUpload: "Încarcă Imagine pentru Audio Spectrogramă",
                txModePhone: "Mod Telefon (Rapid)",
                txModePC: "Mod Prezentare (Calitate Înaltă)",
                btnUpload: "TRANSMITE IMAGINE",
                alertNoFile: "Vă rugăm să selectați o imagine mai întâi!",
                statusReady: "Gata!",
                statusProcessingPhone: "Se procesează local... (Mod Rapid)",
                statusProcessingPC: "Se procesează local... (Mod Calitate Înaltă - Va dura puțin)",
                titleSpectrometer: "Spectrometru Mobil Live",
                btnStartSpectro: "PORNEȘTE",
                btnStopSpectro: "OPREȘTE",
                btnFullscreen: "ECRAN COMPLET",
                errMic: "Accesul la microfon a fost refuzat sau este indisponibil."
            }
        };

        function getActiveSpecies() {
            const key = document.getElementById('speciesSelect').value;
            return SPECIES_PROFILES[key];
        }

        function getActiveModMode() {
            return document.querySelector('input[name="modMode"]:checked').value;
        }

        function getActiveFreqs(sp, modMode) {
            if (modMode === '2fsk') return [sp.freqs4[0], sp.freqs4[3]];
            if (modMode === '4fsk') return sp.freqs4;
            const f0 = sp.freqs4[0];
            const f3 = sp.freqs4[3];
            const step = (f3 - f0) / 15;
            return Array.from({ length: 16 }, (_, i) => Math.round(f0 + i * step));
        }

        function updateSpeciesUI() {
            const sp = getActiveSpecies();
            const mode = getActiveModMode();
            const selectEl = document.getElementById('speciesSelect');
            const grid = document.getElementById('noteGrid');

            // Localize dropdown labels
            for (const opt of selectEl.options) {
                const profile = SPECIES_PROFILES[opt.value];
                opt.text = currentLang === 'ro' ? profile.nameRo : profile.nameEn;
            }

            // Build dynamic Bird Note Test Pads
            grid.innerHTML = '';
            if (mode === '16fsk') {
                const freqs16 = getActiveFreqs(sp, '16fsk');
                freqs16.forEach((freq, i) => {
                    const hexLabel = i.toString(16).toUpperCase();
                    const pad = document.createElement('div');
                    pad.className = 'key';
                    pad.innerHTML = `${hexLabel}<span>${freq}Hz</span>`;
                    pad.onclick = () => playSingleFreq(freq);
                    grid.appendChild(pad);
                });
            } else {
                for (let i = 0; i < 4; i++) {
                    const freq = sp.freqs4[i];
                    const pad = document.createElement('div');
                    pad.className = 'key';

                    if (mode === '2fsk') {
                        if (i === 0) {
                            pad.innerHTML = `BIT 0<span>${freq}Hz</span>`;
                            pad.onclick = () => playSingleFreq(freq);
                        } else if (i === 3) {
                            pad.innerHTML = `BIT 1<span>${freq}Hz</span>`;
                            pad.onclick = () => playSingleFreq(freq);
                        } else {
                            pad.classList.add('inactive');
                            pad.innerHTML = `--<span>${freq}Hz</span>`;
                        }
                    } else {
                        pad.innerHTML = `${i.toString(2).padStart(2, '0')}<span>${freq}Hz</span>`;
                        pad.onclick = () => playSingleFreq(freq);
                    }
                    grid.appendChild(pad);
                }
            }

            const notesLabel = document.getElementById('notesLabel');
            if (mode === '16fsk') {
                const step = Math.round((sp.freqs4[3] - sp.freqs4[0]) / 15);
                notesLabel.innerText = `16-FSK: ${sp.freqs4[0]}Hz–${sp.freqs4[3]}Hz (${step}Hz step, 1 chirp/hex)`;
            } else if (mode === '4fsk') {
                notesLabel.innerText = `4-FSK: ${sp.freqs4.join('Hz / ')}Hz (${Math.round(sp.toneDur * 1000)}ms chirp)`;
            } else {
                notesLabel.innerText = `2-FSK: ${sp.freqs4[0]}Hz (0) & ${sp.freqs4[3]}Hz (1) (${Math.round(sp.toneDur * 1000)}ms chirp)`;
            }
        }

        function setLanguage(lang) {
            currentLang = lang;

            document.getElementById('lang-en').classList.toggle('active', lang === 'en');
            document.getElementById('lang-ro').classList.toggle('active', lang === 'ro');

            document.querySelectorAll('[data-translate]').forEach(el => {
                const key = el.getAttribute('data-translate');
                if (translations[lang][key]) {
                    el.innerText = translations[lang][key];
                }
            });

            document.querySelectorAll('[data-placeholder]').forEach(el => {
                const key = el.getAttribute('data-placeholder');
                if (translations[lang][key]) {
                    el.setAttribute('placeholder', translations[lang][key]);
                }
            });

            if (isSpectroRunning) {
                document.getElementById('btnSpectro').innerText = translations[lang].btnStopSpectro;
            }
            updateSpeciesUI();
        }

        function convertToHex() {
            let text = document.getElementById('plainTextInput').value;
            text = text.replace(/ /g, '_');
            let hexStr = "";
            for (let i = 0; i < text.length; i++) {
                let hexChar = text.charCodeAt(i).toString(16).toUpperCase();
                hexStr += hexChar.length < 2 ? "0" + hexChar : hexChar;
            }
            document.getElementById('hexInput').value = hexStr;
        }

        // --- BIRD AUDIO SYNTHESIZER & OSCILLOSCOPE ---
        let txAudioCtx = null;
        let txAnalyser = null;
        let oscReqId = null;

        function initTxAudio() {
            if (!txAudioCtx) {
                txAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                txAnalyser = txAudioCtx.createAnalyser();
                txAnalyser.fftSize = 2048;
                txAnalyser.connect(txAudioCtx.destination);
                drawOscilloscope();
            }
            if (txAudioCtx.state === 'suspended') {
                txAudioCtx.resume();
            }
            return txAudioCtx;
        }

        function drawOscilloscope() {
            const canvas = document.getElementById('oscCanvas');
            const ctx = canvas.getContext('2d');
            const bufferLength = txAnalyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function draw() {
                oscReqId = requestAnimationFrame(draw);
                txAnalyser.getByteTimeDomainData(dataArray);

                ctx.fillStyle = 'rgb(18, 18, 18)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.lineWidth = 2;
                ctx.strokeStyle = '#00adb5';
                ctx.beginPath();

                const sliceWidth = canvas.width * 1.0 / bufferLength;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    const v = dataArray[i] / 128.0;
                    const y = v * canvas.height / 2;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                    x += sliceWidth;
                }
                ctx.lineTo(canvas.width, canvas.height / 2);
                ctx.stroke();
            }
            draw();
        }

        function playBirdSyllable(targetFreq, sp, modMode, audioCtx, startTime) {
            const dur = sp.toneDur;
            const is16 = (modMode === '16fsk');

            // In 16-FSK, keep pitch scoop inside 35% of one step & scale vibrato to 35%
            // so the note stays organic without crossing adjacent FFT channels.
            const step16 = (sp.freqs4[3] - sp.freqs4[0]) / 15;
            const scoop = is16 ? 0.015 : sp.scoopDur;
            const scoopDir = sp.scoopRatio < 1.0 ? -1 : 1;
            const startFreq = is16
                ? targetFreq + scoopDir * (step16 * 0.35)
                : targetFreq * sp.scoopRatio;
            const vibDepth = is16 ? sp.vibratoDepth * 0.35 : sp.vibratoDepth;

            // Main syrinx oscillator
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'sine';

            osc.frequency.setValueAtTime(startFreq, startTime);
            osc.frequency.exponentialRampToValueAtTime(targetFreq, startTime + scoop);
            osc.frequency.setValueAtTime(targetFreq, startTime + dur - 0.015);

            // Amplitude envelope
            gainNode.gain.setValueAtTime(0.0001, startTime);
            gainNode.gain.linearRampToValueAtTime(0.28, startTime + 0.016);
            gainNode.gain.linearRampToValueAtTime(0.22, startTime + dur - 0.022);
            gainNode.gain.linearRampToValueAtTime(0.0001, startTime + dur);

            // Optional FM vibrato / trill
            if (sp.vibratoRate > 0 && vibDepth > 0) {
                const lfo = audioCtx.createOscillator();
                const lfoGain = audioCtx.createGain();
                lfo.type = 'sine';
                lfo.frequency.setValueAtTime(sp.vibratoRate, startTime);

                lfoGain.gain.setValueAtTime(0, startTime);
                lfoGain.gain.setValueAtTime(0, startTime + scoop);
                lfoGain.gain.linearRampToValueAtTime(vibDepth, startTime + scoop + 0.018);
                lfoGain.gain.setValueAtTime(vibDepth, startTime + dur - 0.02);
                lfoGain.gain.linearRampToValueAtTime(0, startTime + dur);

                lfo.connect(lfoGain);
                lfoGain.connect(osc.frequency);
                lfo.start(startTime);
                lfo.stop(startTime + dur + 0.01);
            }

            osc.connect(gainNode);
            gainNode.connect(txAnalyser);
            osc.start(startTime);
            osc.stop(startTime + dur + 0.01);

            // Optional subtle 2nd harmonic for woody resonance (never collides; species < 1 octave)
            if (sp.harmonicGain > 0) {
                const harmOsc = audioCtx.createOscillator();
                const harmGain = audioCtx.createGain();
                harmOsc.type = 'sine';

                harmOsc.frequency.setValueAtTime(startFreq * 2, startTime);
                harmOsc.frequency.exponentialRampToValueAtTime(targetFreq * 2, startTime + scoop);

                harmGain.gain.setValueAtTime(0.0001, startTime);
                harmGain.gain.linearRampToValueAtTime(0.28 * sp.harmonicGain, startTime + 0.018);
                harmGain.gain.linearRampToValueAtTime(0.0001, startTime + dur);

                harmOsc.connect(harmGain);
                harmGain.connect(txAnalyser);
                harmOsc.start(startTime);
                harmOsc.stop(startTime + dur + 0.01);
            }
        }

        function playBirdHexChar(hexChar, sp, modMode, audioCtx, startTime, isEndOfByte) {
            const val = parseInt(hexChar, 16);
            const symInterval = sp.toneDur + sp.gapDur;

            if (modMode === '16fsk') {
                // 1 syllable per hex digit (4 bits/chirp)
                const freqs16 = getActiveFreqs(sp, '16fsk');
                playBirdSyllable(freqs16[val], sp, modMode, audioCtx, startTime);
                // Add a gentle natural bird breath after every full ASCII letter (2 hex digits)
                const extraPhraseBreath = isEndOfByte ? 0.08 : 0.0;
                return sp.toneDur + sp.gap16 + extraPhraseBreath;
            } else if (modMode === '4fsk') {
                // 2 syllables per hex digit (2 bits/chirp)
                const syms = [(val >> 2) & 0x3, val & 0x3];
                for (let k = 0; k < syms.length; k++) {
                    playBirdSyllable(sp.freqs4[syms[k]], sp, modMode, audioCtx, startTime + k * symInterval);
                }
                return symInterval + sp.toneDur + sp.charGap;
            } else {
                // 2-FSK fallback: 4 syllables per hex digit using widest pair [f0, f3]
                const freqs2 = [sp.freqs4[0], sp.freqs4[3]];
                for (let i = 3; i >= 0; i--) {
                    const bit = (val >> i) & 1;
                    const k = 3 - i;
                    playBirdSyllable(freqs2[bit], sp, modMode, audioCtx, startTime + k * symInterval);
                }
                return 3 * symInterval + sp.toneDur + sp.charGap;
            }
        }

        function transmitInput() {
            const rawText = document.getElementById('hexInput').value.toUpperCase().replace(/[^0-9A-F]/g, '');
            if (!rawText) return;

            const sp = getActiveSpecies();
            const modMode = getActiveModMode();

            // Sacrificial 'F' preamble to absorb hardware lag and align receiver
            const text = "F" + rawText;

            const audioCtx = initTxAudio();
            let time = audioCtx.currentTime + 0.1;

            // Out-of-band wakeup whistle (below f0) to wake mic AGC cleanly
            const syncOsc = audioCtx.createOscillator();
            const syncGain = audioCtx.createGain();
            syncOsc.type = 'sine';
            syncOsc.frequency.setValueAtTime(sp.syncFreq, time);

            syncGain.gain.setValueAtTime(0.0001, time);
            syncGain.gain.linearRampToValueAtTime(0.22, time + 0.08);
            syncGain.gain.setValueAtTime(0.22, time + 0.37);
            syncGain.gain.linearRampToValueAtTime(0.0001, time + 0.45);

            syncOsc.connect(syncGain);
            syncGain.connect(txAnalyser);
            syncOsc.start(time);
            syncOsc.stop(time + 0.46);

            time += 0.58; // 130ms silence before first bird syllable

            for (let idx = 0; idx < text.length; idx++) {
                // idx 0 is preamble 'F'; pairs (1,2), (3,4)... are ASCII bytes
                const isEndOfByte = (idx > 0 && idx % 2 === 0);
                const stride = playBirdHexChar(text[idx], sp, modMode, audioCtx, time, isEndOfByte);
                time += stride;
            }
        }

        function playSingleFreq(freq) {
            const sp = getActiveSpecies();
            const modMode = getActiveModMode();
            const audioCtx = initTxAudio();
            playBirdSyllable(freq, sp, modMode, audioCtx, audioCtx.currentTime + 0.02);
        }

        // --- 100% LOCAL IMAGE-TO-AUDIO ENGINE ---
        async function uploadImage() {
            const fileInput = document.getElementById('imageInput');
            const btn = document.getElementById('uploadBtn');
            const status = document.getElementById('statusMessage');
            const audio = document.getElementById('audioPlayer');
            const modeSelect = document.querySelector('input[name="txMode"]:checked').value;

            if (!fileInput.files[0]) {
                alert(translations[currentLang].alertNoFile);
                return;
            }

            btn.disabled = true;
            status.innerText = modeSelect === 'pc'
                ? translations[currentLang].statusProcessingPC
                : translations[currentLang].statusProcessingPhone;

            audio.style.display = "none";
            audio.src = "";

            const file = fileInput.files[0];
            const img = new Image();
            img.src = URL.createObjectURL(file);

            img.onload = async () => {
                setTimeout(() => processImageToAudio(img, btn, status, audio, modeSelect), 50);
            };
        }

        function processImageToAudio(img, btn, status, audioEl, mode) {
            const durationSec = 6.0;
            const sr = 16000;

            let n_bins = 128;
            let n_frames = 200;
            if (mode === 'pc') {
                n_bins = 256;
                n_frames = 500;
            }

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            canvas.width = n_frames;
            canvas.height = n_bins;
            ctx.drawImage(img, 0, 0, n_frames, n_bins);
            const imgData = ctx.getImageData(0, 0, n_frames, n_bins).data;

            let r_sum = 0, g_sum = 0, b_sum = 0;
            const sampleCount = 50;
            for (let i = 0; i < sampleCount; i++) {
                const idx = Math.floor(Math.random() * (n_frames * n_bins)) * 4;
                r_sum += imgData[idx];
                g_sum += imgData[idx + 1];
                b_sum += imgData[idx + 2];
            }
            const domR = r_sum / sampleCount;
            const domG = g_sum / sampleCount;
            const domB = b_sum / sampleCount;

            const maxDist = Math.sqrt(255 * 255 * 3);
            const totalSamples = Math.floor(durationSec * sr);
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: sr });
            const buffer = audioCtx.createBuffer(1, totalSamples, sr);
            const channelData = buffer.getChannelData(0);

            const freqs = new Float32Array(n_bins);
            const phases = new Float32Array(n_bins);

            for (let y = 0; y < n_bins; y++) {
                const flippedY = (n_bins - 1) - y;
                freqs[flippedY] = 200.0 + (y / n_bins) * (7800.0 - 200.0);
                phases[flippedY] = Math.random() * 2 * Math.PI;
            }

            const samplesPerFrame = totalSamples / n_frames;

            for (let x = 0; x < n_frames; x++) {
                const startSample = Math.floor(x * samplesPerFrame);
                const endSample = Math.floor((x + 1) * samplesPerFrame);

                const magnitudes = new Float32Array(n_bins);
                for (let y = 0; y < n_bins; y++) {
                    const idx = (y * n_frames + x) * 4;
                    const dr = imgData[idx] - domR;
                    const dg = imgData[idx + 1] - domG;
                    const db = imgData[idx + 2] - domB;
                    const dist = Math.sqrt(dr * dr + dg * dg + db * db);
                    let M = dist / maxDist;
                    if (M < 0.1) M = 0;
                    magnitudes[y] = M;
                }

                for (let i = startSample; i < endSample; i++) {
                    const t = i / sr;
                    let sampleVal = 0;
                    for (let y = 0; y < n_bins; y++) {
                        if (magnitudes[y] > 0) {
                            sampleVal += magnitudes[y] * Math.sin(2 * Math.PI * freqs[y] * t + phases[y]);
                        }
                    }
                    channelData[i] = sampleVal;
                }
            }

            let maxAmp = 0;
            for (let i = 0; i < totalSamples; i++) {
                if (Math.abs(channelData[i]) > maxAmp) maxAmp = Math.abs(channelData[i]);
            }
            if (maxAmp > 0) {
                for (let i = 0; i < totalSamples; i++) {
                    channelData[i] = (channelData[i] / maxAmp) * 0.9;
                }
            }

            const wavBlob = bufferToWav(buffer, totalSamples, sr);
            const url = URL.createObjectURL(wavBlob);

            status.innerText = translations[currentLang].statusReady;
            audioEl.src = url;
            audioEl.style.display = "block";
            btn.disabled = false;
        }

        function bufferToWav(abuffer, len, sr) {
            const numOfChan = abuffer.numberOfChannels;
            const length = len * numOfChan * 2 + 44;
            const buffer = new ArrayBuffer(length);
            const view = new DataView(buffer);
            const channels = [];
            let sample;
            let offset = 0;
            let pos = 0;

            function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
            function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

            setUint32(0x46464952);
            setUint32(length - 8);
            setUint32(0x45564157);
            setUint32(0x20746d66);
            setUint32(16);
            setUint16(1);
            setUint16(numOfChan);
            setUint32(sr);
            setUint32(sr * 2 * numOfChan);
            setUint16(numOfChan * 2);
            setUint16(16);
            setUint32(0x61746164);
            setUint32(length - pos - 4);

            for (let i = 0; i < abuffer.numberOfChannels; i++) {
                channels.push(abuffer.getChannelData(i));
            }

            while (pos < length) {
                for (let i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][offset]));
                    sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
                    view.setInt16(pos, sample, true);
                    pos += 2;
                }
                offset++;
            }
            return new Blob([buffer], { type: "audio/wav" });
        }

        // --- LIVE MOBILE SPECTROMETER LOGIC ---
        let spectroAudioCtx = null;
        let analyser = null;
        let spectroMic = null;
        let spectroReqId = null;
        let isSpectroRunning = false;

        function toggleFullscreen() {
            const wrapper = document.getElementById('spectroWrapper');
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (wrapper.requestFullscreen) wrapper.requestFullscreen();
                else if (wrapper.webkitRequestFullscreen) wrapper.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }

        function buildFreqScale(nyquist) {
            const scaleDiv = document.getElementById('freqScale');
            scaleDiv.innerHTML = '';
            for (let i = 4; i >= 0; i--) {
                const freqHz = nyquist * (i / 4);
                const freqKHz = freqHz / 1000;
                const span = document.createElement('span');
                span.innerText = freqKHz >= 1 ? freqKHz.toFixed(1) + 'k' : '0';
                scaleDiv.appendChild(span);
            }
        }

        async function toggleSpectrometer() {
            const btn = document.getElementById('btnSpectro');
            const freqScaleDiv = document.getElementById('freqScale');

            if (isSpectroRunning) {
                cancelAnimationFrame(spectroReqId);
                if (spectroMic) spectroMic.disconnect();
                if (analyser) analyser.disconnect();
                if (spectroAudioCtx) spectroAudioCtx.close();

                isSpectroRunning = false;
                btn.innerText = translations[currentLang].btnStartSpectro;
                btn.style.background = "#00adb5";
                freqScaleDiv.style.display = "none";

                const canvas = document.getElementById('spectroCanvas');
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (document.fullscreenElement || document.webkitFullscreenElement) {
                    toggleFullscreen();
                }
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    },
                    video: false
                });
                spectroAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = spectroAudioCtx.createAnalyser();
                analyser.fftSize = 1024;
                analyser.smoothingTimeConstant = 0.2;

                spectroMic = spectroAudioCtx.createMediaStreamSource(stream);
                spectroMic.connect(analyser);

                isSpectroRunning = true;
                btn.innerText = translations[currentLang].btnStopSpectro;
                btn.style.background = "#d9534f";

                buildFreqScale(spectroAudioCtx.sampleRate / 2);
                freqScaleDiv.style.display = "flex";

                drawSpectrogram();
            } catch (err) {
                alert(translations[currentLang].errMic);
            }
        }

        function drawSpectrogram() {
            const canvas = document.getElementById('spectroCanvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            let lastTime = 0;
            const SHIFT_PX = 2;

            function render(time) {
                if (!isSpectroRunning) return;
                spectroReqId = requestAnimationFrame(render);

                if (time - lastTime < 33) return;
                lastTime = time;

                analyser.getByteFrequencyData(dataArray);
                ctx.drawImage(canvas, -SHIFT_PX, 0);

                const w = canvas.width;
                const h = canvas.height;
                const rightEdge = w - SHIFT_PX;
                const binsPerPixel = Math.floor(bufferLength / h);

                for (let y = 0; y < h; y++) {
                    let sum = 0;
                    for (let i = 0; i < binsPerPixel; i++) {
                        sum += dataArray[y * binsPerPixel + i];
                    }
                    let val = sum / binsPerPixel;

                    let r = val;
                    let g = val > 128 ? (val - 128) * 2 : 0;
                    let b = val > 200 ? (val - 200) * 4 : 0;

                    ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                    ctx.fillRect(rightEdge, h - 1 - y, SHIFT_PX, 1);
                }
            }
            spectroReqId = requestAnimationFrame(render);
        }

        // Initialize UI on load
        updateSpeciesUI();
    </script>
