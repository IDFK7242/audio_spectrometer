<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Acoustic Spectrometer &amp; Bird-Language Lab</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; }
        body {
            background: #121212;
            color: #cccccc;
            font-family: monospace;
            text-align: center;
            padding: 16px;
            margin: 0;
        }
        .top-bar {
            max-width: 520px;
            margin: 0 auto 10px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .profile-badge {
            font-size: 12px;
            font-weight: bold;
            padding: 6px 10px;
            border-radius: 999px;
            background: #1a2a2c;
            color: #00e5ff;
            border: 1px solid #00adb5;
            letter-spacing: 0.5px;
        }
        .profile-badge.classic {
            background: #2b2214;
            color: #ffb74d;
            border-color: #ff9800;
        }
        .lang-switch {
            display: flex;
            border: 1px solid #333;
            border-radius: 4px;
            overflow: hidden;
            background: #1a1a1a;
        }
        .lang-btn {
            background: none;
            border: none;
            color: #777;
            padding: 6px 12px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
            width: auto;
            margin: 0;
            transition: all 0.2s;
        }
        .lang-btn.active { background: #00adb5; color: #fff; }
        h2 { margin: 8px auto 16px auto; max-width: 520px; color: #eee; }
        .section {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 18px;
            border-radius: 8px;
            max-width: 520px;
            margin: 16px auto;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.35);
        }
        .section-title {
            margin: 0 0 12px 0;
            font-size: 15px;
            font-weight: bold;
            color: #e0e0e0;
        }
        input[type="text"], select {
            font-size: 16px;
            padding: 10px;
            width: 100%;
            text-align: center;
            background: #222;
            color: #fff;
            border: 1px solid #00adb5;
            border-radius: 4px;
            font-family: monospace;
        }
        select { margin-bottom: 10px; cursor: pointer; }
        input[type="file"] { margin: 12px 0; color: #ccc; max-width: 100%; }
        button {
            font-size: 15px;
            padding: 12px 20px;
            margin-top: 12px;
            background: #00adb5;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
            font-family: monospace;
        }
        button:active { background: #007a80; }
        button:disabled { background: #555; cursor: not-allowed; }
        button.btn-stop { background: #d9534f; }
        button.btn-stop:active { background: #b52b27; }
        button.btn-secondary { background: #3a3a3a; }
        button.btn-secondary:active { background: #2a2a2a; }

        .preset-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin: 10px 0 4px 0;
        }
        .preset-chip {
            width: auto;
            margin: 0;
            padding: 5px 10px;
            font-size: 12px;
            background: #252525;
            color: #00e5ff;
            border: 1px solid #3a5a5d;
            border-radius: 999px;
        }
        .preset-chip:hover { background: #1f3436; }

        .hint-text {
            font-size: 11px;
            color: #ffb74d;
            min-height: 14px;
            margin-top: 6px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 12px auto;
        }
        .key {
            background: #222;
            border: 1px solid #444;
            padding: 10px 4px;
            font-size: 14px;
            color: #00adb5;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
            user-select: none;
            transition: all 0.15s;
        }
        .key:active, .key.playing { background: #00adb5; color: #fff; border-color: #00e5ff; }
        .key.inactive { opacity: 0.25; pointer-events: none; border-style: dashed; }
        .key span { display: block; font-size: 10px; color: #888; margin-top: 3px; }
        .key.playing span { color: #e0f7fa; }

        .radio-group {
            background: #222;
            padding: 12px 14px;
            border-radius: 4px;
            text-align: left;
            margin: 10px 0;
            border: 1px solid #444;
        }
        .radio-group label {
            display: block;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 13px;
        }
        .radio-group label:last-child { margin-bottom: 0; }
        .radio-group label.disabled-opt { opacity: 0.38; cursor: not-allowed; }
        .radio-group input[type="radio"] { margin-right: 8px; accent-color: #00adb5; }

        .tx-progress-wrap {
            display: none;
            margin-top: 10px;
            text-align: left;
        }
        .tx-progress-bar-bg {
            width: 100%;
            height: 8px;
            background: #262626;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #333;
        }
        .tx-progress-bar-fill {
            height: 100%;
            width: 0%;
            background: #00adb5;
            transition: width 0.08s linear;
        }
        .tx-progress-label {
            font-size: 12px;
            color: #00e5ff;
            margin-top: 5px;
            text-align: center;
        }

        #statusMessage {
            margin-top: 12px;
            color: #00adb5;
            font-weight: bold;
            min-height: 20px;
            font-size: 13px;
        }
        audio { width: 100%; margin-top: 12px; outline: none; }

        .spectro-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 10px;
        }
        .spectro-controls label {
            font-size: 12px;
            color: #aaa;
            white-space: nowrap;
        }
        .spectro-controls select {
            margin: 0;
            padding: 6px;
            font-size: 13px;
        }

        /* Fullscreen styles for the spectrometer wrapper */
        #spectroWrapper:fullscreen { height: 100vh !important; border: none; border-radius: 0; max-width: 100%; margin: 0; }
        #spectroWrapper:-webkit-full-screen { height: 100vh !important; border: none; border-radius: 0; max-width: 100%; margin: 0; }
    </style>
</head>
<body>
    <!-- TOP BAR: PROFILE BADGE & LANGUAGE SWITCHER -->
    <div class="top-bar">
        <div id="activeBadge" class="profile-badge">CANARY · 4-FSK</div>
        <div class="lang-switch">
            <button onclick="setLanguage('en')" id="lang-en" class="lang-btn active">EN</button>
            <button onclick="setLanguage('ro')" id="lang-ro" class="lang-btn">RO</button>
        </div>
    </div>

    <h2 data-translate="titleMain">Acoustic Spectrometer &amp; Bird-Language Lab</h2>

    <!-- TEXT TO HEX CONVERTER -->
    <div class="section">
        <p class="section-title" data-translate="titleConverter">Text to Hex Converter</p>
        <input type="text" id="plainTextInput" placeholder="Enter normal text here (e.g. Hello)" data-placeholder="inputPlaceholder">
        <div class="preset-row">
            <button class="preset-chip" onclick="applyPreset('HI')">HI</button>
            <button class="preset-chip" onclick="applyPreset('SALUT')">SALUT</button>
            <button class="preset-chip" onclick="applyPreset('SOS')">SOS</button>
            <button class="preset-chip" onclick="applyPreset('HELLO')">HELLO</button>
        </div>
        <button onclick="convertToHex()" data-translate="btnConvert">CONVERT TO HEX</button>
        <div id="normHint" class="hint-text"></div>
    </div>

    <!-- UNIFIED CLASSIC & BIRD TRANSMITTER -->
    <div class="section">
        <p class="section-title" data-translate="titleProfile">Select Mode &amp; Acoustic Profile</p>
        <select id="profileSelect" onchange="updateProfileUI()">
            <optgroup id="optGroupClassic" label="Classic Digital Mode">
                <option value="classic">Classic Robot (2.4 &amp; 3.0 kHz Square)</option>
            </optgroup>
            <optgroup id="optGroupBird" label="Bird Language Mode">
                <option value="blackbird">Eurasian Blackbird (1.8 - 3.3 kHz)</option>
                <option value="canary" selected>Canary (3.0 - 4.95 kHz)</option>
                <option value="greattit">Great Tit (3.9 - 6.15 kHz)</option>
                <option value="goldcrest">Goldcrest (5.2 - 7.9 kHz)</option>
            </optgroup>
        </select>

        <div class="radio-group">
            <label id="lblMod16">
                <input type="radio" name="modMode" value="16fsk" onchange="updateProfileUI()">
                <span data-translate="modMode16">16-FSK Quiet Room (16 Notes - Ultra Fast &amp; Melodic)</span>
            </label>
            <label id="lblMod4">
                <input type="radio" name="modMode" value="4fsk" checked onchange="updateProfileUI()">
                <span data-translate="modMode4">4-FSK Bird Song (4 Notes - Balanced)</span>
            </label>
            <label id="lblMod2">
                <input type="radio" name="modMode" value="2fsk" onchange="updateProfileUI()">
                <span data-translate="modMode2">2-FSK Noise-Safe (2 Notes - Classroom Resistant)</span>
            </label>
        </div>

        <p style="margin: 12px 0 6px 0; font-size: 14px;" data-translate="titleTransmitter">Hex Code to Transmit</p>
        <input type="text" id="hexInput" placeholder="4849" data-placeholder="hexPlaceholder" value="4849">
        <button id="btnTransmit" onclick="handleTransmitClick()" data-translate="btnTransmit">TRANSMIT / SING MESSAGE</button>

        <div id="txProgressWrap" class="tx-progress-wrap">
            <div class="tx-progress-bar-bg">
                <div id="txProgressFill" class="tx-progress-bar-fill"></div>
            </div>
            <div id="txProgressLabel" class="tx-progress-label"></div>
        </div>

        <p style="margin-top: 14px; margin-bottom: 4px; font-size: 12px; color: #999;" data-translate="padLabel">Tap to test individual notes:</p>
        <div class="grid" id="noteGrid"></div>
        <p id="notesLabel" style="font-size: 12px; color: #777; margin-bottom: 0;"></p>

        <!-- SIGNAL OSCILLOSCOPE -->
        <p style="margin-top: 14px; margin-bottom: 6px; font-size: 13px;" data-translate="titleOscilloscope">Signal Oscilloscope</p>
        <canvas id="oscCanvas" width="500" height="100" style="width:100%; height:100px; background:#000; border: 1px solid #333; border-radius: 4px; display: block; margin: 0 auto;"></canvas>
    </div>

    <!-- IMAGE TO SPECTROGRAM -->
    <div class="section">
        <p class="section-title" data-translate="titleUpload">Upload Image for Spectrogram Audio</p>

        <div class="radio-group">
            <label>
                <input type="radio" name="txMode" value="phone" checked>
                <span data-translate="txModePhone">Phone to Phone Mode (Fast)</span>
            </label>
            <label>
                <input type="radio" name="txMode" value="pc">
                <span data-translate="txModePC">Presentation Mode (High Quality)</span>
            </label>
        </div>

        <input type="file" id="imageInput" accept="image/png, image/jpeg, image/webp">
        <button id="uploadBtn" onclick="uploadImage()" data-translate="btnUpload">GENERATE SPECTROGRAM AUDIO</button>
        <div id="statusMessage"></div>
        <audio id="audioPlayer" controls style="display: none;"></audio>
    </div>

    <!-- LIVE MOBILE SPECTROMETER -->
    <div class="section">
        <p class="section-title" data-translate="titleSpectrometer">Live Mobile Spectrometer</p>

        <div class="spectro-controls">
            <label for="spectroRangeSelect" data-translate="lblSpectroRange">Frequency Range:</label>
            <select id="spectroRangeSelect" onchange="onSpectroRangeChange()">
                <option value="8000" selected>0 - 8 kHz (Images &amp; Classic)</option>
                <option value="10000">0 - 10 kHz (All Birds)</option>
                <option value="0">Full (0 - Nyquist)</option>
            </select>
        </div>

        <div id="spectroWrapper" style="position: relative; width: 100%; height: 210px; background: #000; border: 1px solid #333; border-radius: 4px; overflow: hidden; margin: 0 auto;">
            <canvas id="spectroCanvas" width="300" height="160" style="width: 100%; height: 100%; display: block;"></canvas>
            <div id="freqScale" style="position: absolute; right: 0; top: 0; bottom: 0; width: 48px; background: rgba(0,0,0,0.72); color: #00adb5; font-size: 10px; font-weight: bold; display: none; flex-direction: column; justify-content: space-between; padding: 5px; text-align: right; pointer-events: none; border-left: 1px solid #333;"></div>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 12px;">
            <button id="btnSpectro" onclick="toggleSpectrometer()" data-translate="btnStartSpectro" style="margin-top: 0;">START</button>
            <button onclick="toggleFullscreen()" data-translate="btnFullscreen" class="btn-secondary" style="margin-top: 0; width: 42%;">FULLSCREEN</button>
        </div>
    </div>

        // --- PROFILE & MODE HELPERS ---

        function getActiveProfileKey() {
            return document.getElementById('profileSelect').value;
        }

        function getActiveProfile() {
            return PROFILES[getActiveProfileKey()];
        }

        function getActiveModMode() {
            return document.querySelector('input[name="modMode"]:checked').value;
        }

        function getActiveFreqs(profile, modMode) {
            if (modMode === '2fsk') return [profile.freqs4[0], profile.freqs4[3]];
            if (modMode === '4fsk') return profile.freqs4.slice();
            const f0 = profile.freqs4[0];
            const f3 = profile.freqs4[3];
            const step = (f3 - f0) / 15;
            return Array.from({ length: 16 }, (_, i) => Math.round(f0 + i * step));
        }

        function updateProfileUI() {
            const key = getActiveProfileKey();
            const profile = getActiveProfile();
            const supported = profile.supportedModes || ['2fsk'];

            // Enforce supported modulation modes for the active profile
            const radios = document.querySelectorAll('input[name="modMode"]');
            radios.forEach(r => {
                const isAllowed = supported.includes(r.value);

        // --- ROMANIAN DIACRITICS TRANSLITERATION & TEXT-TO-HEX ---

        function normalizeToAscii(input) {
            const roMap = {
                'ă': 'a', 'Ă': 'A', 'â': 'a', 'Â': 'A', 'î': 'i', 'Î': 'I',
                'ș': 's', 'Ș': 'S', 'ş': 's', 'Ş': 'S',
                'ț': 't', 'Ț': 'T', 'ţ': 't', 'Ţ': 'T'
            };
            let mapped = input.replace(/[ăĂâÂîÎșȘşŞțȚţŢ]/g, ch => roMap[ch] || ch);
            // Strip any remaining combining accents (e.g. é -> e)
            mapped = mapped.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
            // Replace non-printable / non-ASCII chars with '?'
            let clean = '';
            for (let i = 0; i < mapped.length; i++) {
                const code = mapped.charCodeAt(i);
                clean += (code >= 32 && code <= 126) ? mapped[i] : '?';
            }
            return { clean, changed: clean !== input };
        }

        function convertToHex() {
            const raw = document.getElementById('plainTextInput').value;
            const { clean, changed } = normalizeToAscii(raw);
            document.getElementById('normHint').innerText = changed ? translations[currentLang].normHint : '';

            const underscored = clean.replace(/ /g, '_');
            let hexStr = "";
            for (let i = 0; i < underscored.length; i++) {
                const hexChar = underscored.charCodeAt(i).toString(16).toUpperCase().padStart(2, '0');
                hexStr += hexChar;
            }
            document.getElementById('hexInput').value = hexStr;
        }

        function applyPreset(word) {
            document.getElementById('plainTextInput').value = word;
            convertToHex();
        }

        // --- UNIFIED AUDIO SYNTHESIZER, TX CONTROLLER & OSCILLOSCOPE ---

        let txAudioCtx = null;
        let txAnalyser = null;
        let oscReqId = null;

        let isTransmitting = false;
        let activeTxNodes = [];
        let activeTxTimers = [];

        function initTxAudio() {
            if (!txAudioCtx) {
                txAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                txAnalyser = txAudioCtx.createAnalyser();
                txAnalyser.fftSize = 2048;
                txAnalyser.connect(txAudioCtx.destination);
                drawOscilloscope();
            }
            if (txAudioCtx.state === 'suspended') {
                txAudioCtx.resume();
            }
            return txAudioCtx;
        }

        function drawOscilloscope() {
            const canvas = document.getElementById('oscCanvas');
            const ctx = canvas.getContext('2d');
            const bufferLength = txAnalyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function draw() {
                oscReqId = requestAnimationFrame(draw);
                txAnalyser.getByteTimeDomainData(dataArray);

                ctx.fillStyle = 'rgb(18, 18, 18)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.lineWidth = 2;
                ctx.strokeStyle = '#00adb5';
                ctx.beginPath();

                const sliceWidth = canvas.width / bufferLength;
                let x = 0;
                for (let i = 0; i < bufferLength; i++) {
                    const v = dataArray[i] / 128.0;
                    const y = (v * canvas.height) / 2;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                    x += sliceWidth;
                }
                ctx.lineTo(canvas.width, canvas.height / 2);
                ctx.stroke();
            }
            draw();
        }

        function registerTxNode(node) {
            activeTxNodes.push(node);
        }

        function stopTransmission(resetProgress = true) {
            activeTxTimers.forEach(id => clearTimeout(id));
            activeTxTimers = [];

            activeTxNodes.forEach(node => {
                try { node.stop(); } catch (_) {}
                try { node.disconnect(); } catch (_) {}
            });
            activeTxNodes = [];

            isTransmitting = false;
            const btn = document.getElementById('btnTransmit');
            btn.classList.remove('btn-stop');
            btn.innerText = translations[currentLang].btnTransmit;

            document.querySelectorAll('#noteGrid .key.playing').forEach(el => el.classList.remove('playing'));

            if (resetProgress) {
                document.getElementById('txProgressWrap').style.display = 'none';
                document.getElementById('txProgressFill').style.width = '0%';
                document.getElementById('txProgressLabel').innerText = '';
            }
        }

        function playSquareSyllable(targetFreq, profile, audioCtx, startTime) {
            const dur = profile.toneDur;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.type = 'square';
            osc.frequency.setValueAtTime(targetFreq, startTime);

            gainNode.gain.setValueAtTime(0, startTime);
            gainNode.gain.linearRampToValueAtTime(0.2, startTime + 0.02);
            gainNode.gain.setValueAtTime(0.2, startTime + dur - 0.02);
            gainNode.gain.linearRampToValueAtTime(0, startTime + dur);

            osc.connect(gainNode);
            gainNode.connect(txAnalyser);
            osc.start(startTime);
            osc.stop(startTime + dur + 0.005);
            registerTxNode(osc);
        }

        function playBirdSyllable(targetFreq, profile, modMode, audioCtx, startTime) {
            const dur = profile.toneDur;
            const is16 = (modMode === '16fsk');

            const step16 = (profile.freqs4[3] - profile.freqs4[0]) / 15;
            const scoop = is16 ? 0.015 : profile.scoopDur;
            const scoopDir = profile.scoopRatio < 1.0 ? -1 : 1;
            const startFreq = is16
                ? targetFreq + scoopDir * (step16 * 0.35)
                : targetFreq * profile.scoopRatio;
            const vibDepth = is16 ? profile.vibratoDepth * 0.35 : profile.vibratoDepth;

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'sine';

            osc.frequency.setValueAtTime(startFreq, startTime);
            if (scoop > 0) {
                osc.frequency.exponentialRampToValueAtTime(targetFreq, startTime + scoop);
            }
            osc.frequency.setValueAtTime(targetFreq, startTime + dur - 0.015);

            gainNode.gain.setValueAtTime(0.0001, startTime);
            gainNode.gain.linearRampToValueAtTime(0.28, startTime + 0.016);
            gainNode.gain.linearRampToValueAtTime(0.22, startTime + dur - 0.022);
            gainNode.gain.linearRampToValueAtTime(0.0001, startTime + dur);

            if (profile.vibratoRate > 0 && vibDepth > 0) {
                const lfo = audioCtx.createOscillator();
                const lfoGain = audioCtx.createGain();
                lfo.type = 'sine';
                lfo.frequency.setValueAtTime(profile.vibratoRate, startTime);

                lfoGain.gain.setValueAtTime(0, startTime);
                lfoGain.gain.setValueAtTime(0, startTime + scoop);
                lfoGain.gain.linearRampToValueAtTime(vibDepth, startTime + scoop + 0.018);
                lfoGain.gain.setValueAtTime(vibDepth, startTime + dur - 0.02);
                lfoGain.gain.linearRampToValueAtTime(0, startTime + dur);

                lfo.connect(lfoGain);
                lfoGain.connect(osc.frequency);
                lfo.start(startTime);
                lfo.stop(startTime + dur + 0.01);
                registerTxNode(lfo);
            }

            osc.connect(gainNode);
            gainNode.connect(txAnalyser);
            osc.start(startTime);
            osc.stop(startTime + dur + 0.01);
            registerTxNode(osc);

            if (profile.harmonicGain > 0) {
                const harmOsc = audioCtx.createOscillator();
                const harmGain = audioCtx.createGain();
                harmOsc.type = 'sine';

                harmOsc.frequency.setValueAtTime(startFreq * 2, startTime);
                if (scoop > 0) {
                    harmOsc.frequency.exponentialRampToValueAtTime(targetFreq * 2, startTime + scoop);
                }

                harmGain.gain.setValueAtTime(0.0001, startTime);
                harmGain.gain.linearRampToValueAtTime(0.28 * profile.harmonicGain, startTime + 0.018);
                harmGain.gain.linearRampToValueAtTime(0.0001, startTime + dur);

                harmOsc.connect(harmGain);
                harmGain.connect(txAnalyser);
                harmOsc.start(startTime);
                harmOsc.stop(startTime + dur + 0.01);
                registerTxNode(harmOsc);
            }
        }

        function playSyllable(targetFreq, profile, modMode, audioCtx, startTime) {
            if (profile.waveform === 'square') {
                playSquareSyllable(targetFreq, profile, audioCtx, startTime);
            } else {
                playBirdSyllable(targetFreq, profile, modMode, audioCtx, startTime);
            }
        }

        function schedulePadFlash(freq, delayMs, durMs) {
            const t1 = setTimeout(() => {
                if (!isTransmitting) return;
                document.querySelectorAll('#noteGrid .key.playing').forEach(el => el.classList.remove('playing'));
                const pad = document.querySelector(`#noteGrid .key[data-freq="${freq}"]`);
                if (pad) pad.classList.add('playing');
            }, Math.max(0, delayMs));
            const t2 = setTimeout(() => {
                const pad = document.querySelector(`#noteGrid .key[data-freq="${freq}"]`);
                if (pad) pad.classList.remove('playing');
            }, Math.max(0, delayMs + durMs));
            activeTxTimers.push(t1, t2);
        }

        function playHexChar(hexChar, profile, modMode, audioCtx, startTime, isEndOfByte, ctxBaseTime) {
            const val = parseInt(hexChar, 16);
            const symInterval = profile.toneDur + profile.gapDur;

            if (modMode === '16fsk') {
                const freqs16 = getActiveFreqs(profile, '16fsk');
                const f = freqs16[val];
                playSyllable(f, profile, modMode, audioCtx, startTime);
                schedulePadFlash(f, (startTime - ctxBaseTime) * 1000, profile.toneDur * 1000);
                const extraPhraseBreath = isEndOfByte ? 0.08 : 0.0;
                return profile.toneDur + profile.gap16 + extraPhraseBreath;
            } else if (modMode === '4fsk') {
                const syms = [(val >> 2) & 0x3, val & 0x3];
                for (let k = 0; k < syms.length; k++) {
                    const f = profile.freqs4[syms[k]];
                    const t = startTime + k * symInterval;
                    playSyllable(f, profile, modMode, audioCtx, t);
                    schedulePadFlash(f, (t - ctxBaseTime) * 1000, profile.toneDur * 1000);
                }
                return symInterval + profile.toneDur + profile.charGap;
            } else {
                const freqs2 = [profile.freqs4[0], profile.freqs4[3]];
                for (let i = 3; i >= 0; i--) {
                    const bit = (val >> i) & 1;
                    const k = 3 - i;
                    const f = freqs2[bit];
                    const t = startTime + k * symInterval;
                    playSyllable(f, profile, modMode, audioCtx, t);
                    schedulePadFlash(f, (t - ctxBaseTime) * 1000, profile.toneDur * 1000);
                }
                return 3 * symInterval + profile.toneDur + profile.charGap;
            }
        }

        function handleTransmitClick() {
            if (isTransmitting) {
                stopTransmission(true);
                return;
            }
            transmitInput();
        }

        function transmitInput() {
            const rawText = document.getElementById('hexInput').value.toUpperCase().replace(/[^0-9A-F]/g, '');
            if (!rawText) {
                alert(translations[currentLang].alertEmptyHex);
                return;
            }

            stopTransmission(true);

            const profile = getActiveProfile();
            const modMode = getActiveModMode();
            const text = "F" + rawText; // Sacrificial 'F' preamble

            const audioCtx = initTxAudio();
            const baseTime = audioCtx.currentTime;
            let time = baseTime + 0.10;

            isTransmitting = true;
            const btn = document.getElementById('btnTransmit');
            btn.classList.add('btn-stop');
            btn.innerText = translations[currentLang].btnStopTx;

            const progWrap = document.getElementById('txProgressWrap');
            const progFill = document.getElementById('txProgressFill');
            const progLabel = document.getElementById('txProgressLabel');
            progWrap.style.display = 'block';
            progFill.style.width = '4%';
            progLabel.innerText = translations[currentLang].txWakeup;

            // Wakeup tone
            const syncOsc = audioCtx.createOscillator();
            const syncGain = audioCtx.createGain();
            syncOsc.type = 'sine';
            syncOsc.frequency.setValueAtTime(profile.syncFreq, time);

            const syncDur = profile.waveform === 'square' ? 0.50 : 0.45;
            syncGain.gain.setValueAtTime(0.0001, time);
            syncGain.gain.linearRampToValueAtTime(0.22, time + 0.08);
            syncGain.gain.setValueAtTime(0.22, time + syncDur - 0.08);
            syncGain.gain.linearRampToValueAtTime(0.0001, time + syncDur);

            syncOsc.connect(syncGain);
            syncGain.connect(txAnalyser);
            syncOsc.start(time);
            syncOsc.stop(time + syncDur + 0.01);
            registerTxNode(syncOsc);

            time += (profile.waveform === 'square') ? 0.60 : 0.58;

            for (let idx = 0; idx < text.length; idx++) {
                const ch = text[idx];
                const isEndOfByte = (idx > 0 && idx % 2 === 0);
                const charStartMs = (time - baseTime) * 1000;
                const pct = Math.round(((idx + 1) / text.length) * 100);

                const timerId = setTimeout(() => {
                    if (!isTransmitting) return;
                    progFill.style.width = `${pct}%`;
                    if (idx === 0) {
                        progLabel.innerText = `${translations[currentLang].txSending}: [SYNC F]`;
                    } else {
                        progLabel.innerText = `${translations[currentLang].txSending}: ${rawText.slice(0, idx)} (${idx}/${rawText.length})`;
                    }
                }, Math.max(0, charStartMs));
                activeTxTimers.push(timerId);

                const stride = playHexChar(ch, profile, modMode, audioCtx, time, isEndOfByte, baseTime);
                time += stride;
            }

            const totalMs = Math.max(100, (time - baseTime) * 1000);
            const doneTimer = setTimeout(() => {
                if (!isTransmitting) return;
                progFill.style.width = '100%';
                progLabel.innerText = translations[currentLang].txDone;
                stopTransmission(false);
            }, totalMs);
            activeTxTimers.push(doneTimer);
        }

        function playSingleFreq(freq, padEl) {
            const profile = getActiveProfile();
            const modMode = getActiveModMode();
            const audioCtx = initTxAudio();
            playSyllable(freq, profile, modMode, audioCtx, audioCtx.currentTime + 0.02);
            if (padEl) {
                padEl.classList.add('playing');
                setTimeout(() => padEl.classList.remove('playing'), profile.toneDur * 1000 + 30);
            }
        }

        // --- 100% LOCAL NON-BLOCKING IMAGE-TO-AUDIO ENGINE (NO AUDIOCONTEXT LEAK) ---

        let lastWavObjectUrl = null;

        function uploadImage() {
            const fileInput = document.getElementById('imageInput');
            const btn = document.getElementById('uploadBtn');
            const status = document.getElementById('statusMessage');
            const audio = document.getElementById('audioPlayer');
            const modeSelect = document.querySelector('input[name="txMode"]:checked').value;

            if (!fileInput.files[0]) {
                alert(translations[currentLang].alertNoFile);
                return;
            }

            btn.disabled = true;
            status.innerText = `${translations[currentLang].statusProcessing} 0%`;
            audio.style.display = "none";
            audio.src = "";

            const file = fileInput.files[0];
            const imgUrl = URL.createObjectURL(file);
            const img = new Image();

            img.onload = () => {
                URL.revokeObjectURL(imgUrl);
                processImageToAudioChunked(img, btn, status, audio, modeSelect);
            };
            img.onerror = () => {
                URL.revokeObjectURL(imgUrl);
                btn.disabled = false;
                status.innerText = "";
                alert(translations[currentLang].alertBadFile);
            };
            img.src = imgUrl;
        }

        function processImageToAudioChunked(img, btn, status, audioEl, mode) {
            const durationSec = 6.0;
            const sr = 16000;
            const n_bins = (mode === 'pc') ? 256 : 128;
            const n_frames = (mode === 'pc') ? 500 : 200;

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            canvas.width = n_frames;
            canvas.height = n_bins;
            ctx.drawImage(img, 0, 0, n_frames, n_bins);
            const imgData = ctx.getImageData(0, 0, n_frames, n_bins).data;

            let r_sum = 0, g_sum = 0, b_sum = 0;
            const sampleCount = 50;
            for (let i = 0; i < sampleCount; i++) {
                const idx = Math.floor(Math.random() * (n_frames * n_bins)) * 4;
                r_sum += imgData[idx];
                g_sum += imgData[idx + 1];
                b_sum += imgData[idx + 2];
            }
            const domR = r_sum / sampleCount;
            const domG = g_sum / sampleCount;
            const domB = b_sum / sampleCount;

            const maxDist = Math.sqrt(255 * 255 * 3);
            const totalSamples = Math.floor(durationSec * sr);
            const channelData = new Float32Array(totalSamples);

            const freqs = new Float32Array(n_bins);
            const phases = new Float32Array(n_bins);
            for (let y = 0; y < n_bins; y++) {
                const flippedY = (n_bins - 1) - y;
                freqs[flippedY] = 200.0 + (y / n_bins) * (7800.0 - 200.0);
                phases[flippedY] = Math.random() * 2 * Math.PI;
            }

            const samplesPerFrame = totalSamples / n_frames;
            const chunkSize = (mode === 'pc') ? 10 : 20;
            let frameX = 0;

            function processChunk() {
                const endX = Math.min(frameX + chunkSize, n_frames);
                const magnitudes = new Float32Array(n_bins);

                for (let x = frameX; x < endX; x++) {
                    const startSample = Math.floor(x * samplesPerFrame);
                    const endSample = Math.floor((x + 1) * samplesPerFrame);

                    for (let y = 0; y < n_bins; y++) {
                        const idx = (y * n_frames + x) * 4;
                        const dr = imgData[idx] - domR;
                        const dg = imgData[idx + 1] - domG;
                        const db = imgData[idx + 2] - domB;
                        const dist = Math.sqrt(dr * dr + dg * dg + db * db);
                        let M = dist / maxDist;
                        if (M < 0.1) M = 0;
                        magnitudes[y] = M;
                    }

                    for (let i = startSample; i < endSample; i++) {
                        const t = i / sr;
                        let sampleVal = 0;
                        for (let y = 0; y < n_bins; y++) {
                            if (magnitudes[y] > 0) {
                                sampleVal += magnitudes[y] * Math.sin(2 * Math.PI * freqs[y] * t + phases[y]);
                            }
                        }
                        channelData[i] = sampleVal;
                    }
                }

                frameX = endX;
                const pct = Math.round((frameX / n_frames) * 100);
                status.innerText = `${translations[currentLang].statusProcessing} ${pct}%`;

                if (frameX < n_frames) {
                    setTimeout(processChunk, 0);
                    return;
                }

                // Normalize & encode WAV directly without creating an AudioContext
                let maxAmp = 0;
                for (let i = 0; i < totalSamples; i++) {
                    const a = Math.abs(channelData[i]);
                    if (a > maxAmp) maxAmp = a;
                }
                if (maxAmp > 0) {
                    const scale = 0.9 / maxAmp;
                    for (let i = 0; i < totalSamples; i++) {
                        channelData[i] *= scale;
                    }
                }

                if (lastWavObjectUrl) {
                    URL.revokeObjectURL(lastWavObjectUrl);
                }
                const wavBlob = float32ToWav(channelData, sr);
                lastWavObjectUrl = URL.createObjectURL(wavBlob);

                status.innerText = translations[currentLang].statusReady;
                audioEl.src = lastWavObjectUrl;
                audioEl.style.display = "block";
                btn.disabled = false;
            }

            setTimeout(processChunk, 10);
        }

        function float32ToWav(samples, sr) {
            const len = samples.length;
            const buffer = new ArrayBuffer(len * 2 + 44);
            const view = new DataView(buffer);
            let pos = 0;

            function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
            function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

            setUint32(0x46464952); // "RIFF"
            setUint32(len * 2 + 36);
            setUint32(0x45564157); // "WAVE"
            setUint32(0x20746d66); // "fmt "
            setUint32(16);
            setUint16(1);          // PCM
            setUint16(1);          // Mono
            setUint32(sr);
            setUint32(sr * 2);
            setUint16(2);
            setUint16(16);
            setUint32(0x61746164); // "data"
            setUint32(len * 2);

            for (let i = 0; i < len; i++) {
                const s = Math.max(-1, Math.min(1, samples[i]));
                const pcm = s < 0 ? Math.round(s * 32768) : Math.round(s * 32767);
                view.setInt16(pos, pcm, true);
                pos += 2;
            }
            return new Blob([buffer], { type: "audio/wav" });
        }

        // --- LIVE MOBILE SPECTROMETER LOGIC (WITH ZOOM & PROPER MIC CLEANUP) ---

        let spectroAudioCtx = null;
        let analyser = null;
        let spectroMic = null;
        let spectroStream = null;
        let spectroReqId = null;
        let isSpectroRunning = false;

        function getSpectroMaxFreq() {
            const selected = parseInt(document.getElementById('spectroRangeSelect').value, 10);
            const nyquist = spectroAudioCtx ? spectroAudioCtx.sampleRate / 2 : 22050;
            if (!selected || selected >= nyquist) return nyquist;
            return selected;
        }

        function onSpectroRangeChange() {
            if (isSpectroRunning && spectroAudioCtx) {
                buildFreqScale(getSpectroMaxFreq());
                const canvas = document.getElementById('spectroCanvas');
                canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        function toggleFullscreen() {
            const wrapper = document.getElementById('spectroWrapper');
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (wrapper.requestFullscreen) wrapper.requestFullscreen();
                else if (wrapper.webkitRequestFullscreen) wrapper.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }

        function buildFreqScale(maxFreqHz) {
            const scaleDiv = document.getElementById('freqScale');
            scaleDiv.innerHTML = '';
            for (let i = 4; i >= 0; i--) {
                const freqHz = maxFreqHz * (i / 4);
                const freqKHz = freqHz / 1000;
                const span = document.createElement('span');
                span.innerText = freqKHz >= 1 ? freqKHz.toFixed(1) + 'k' : (freqHz > 0 ? Math.round(freqHz) + '' : '0');
                scaleDiv.appendChild(span);
            }
        }

        async function toggleSpectrometer() {
            const btn = document.getElementById('btnSpectro');
            const freqScaleDiv = document.getElementById('freqScale');

            if (isSpectroRunning) {
                cancelAnimationFrame(spectroReqId);
                if (spectroMic) { spectroMic.disconnect(); spectroMic = null; }
                if (analyser) { analyser.disconnect(); analyser = null; }
                if (spectroStream) {
                    spectroStream.getTracks().forEach(track => track.stop());
                    spectroStream = null;
                }
                if (spectroAudioCtx) {
                    await spectroAudioCtx.close().catch(() => {});
                    spectroAudioCtx = null;
                }

                isSpectroRunning = false;
                btn.innerText = translations[currentLang].btnStartSpectro;
                btn.style.background = "#00adb5";
                freqScaleDiv.style.display = "none";

                const canvas = document.getElementById('spectroCanvas');
                canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);

                if (document.fullscreenElement || document.webkitFullscreenElement) {
                    toggleFullscreen();
                }
                return;
            }

            try {
                spectroStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    },
                    video: false
                });
                spectroAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = spectroAudioCtx.createAnalyser();
                analyser.fftSize = 2048;
                analyser.smoothingTimeConstant = 0.2;

                spectroMic = spectroAudioCtx.createMediaStreamSource(spectroStream);
                spectroMic.connect(analyser);

                isSpectroRunning = true;
                btn.innerText = translations[currentLang].btnStopSpectro;
                btn.style.background = "#d9534f";

                buildFreqScale(getSpectroMaxFreq());
                freqScaleDiv.style.display = "flex";

                drawSpectrogram();
            } catch (err) {
                if (spectroStream) {
                    spectroStream.getTracks().forEach(track => track.stop());
                    spectroStream = null;
                }
                alert(translations[currentLang].errMic);
            }
        }

        function drawSpectrogram() {
            const canvas = document.getElementById('spectroCanvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            let lastTime = 0;
            const SHIFT_PX = 2;

            function render(time) {
                if (!isSpectroRunning || !analyser || !spectroAudioCtx) return;
                spectroReqId = requestAnimationFrame(render);

                if (time - lastTime < 33) return;
                lastTime = time;

                analyser.getByteFrequencyData(dataArray);
                ctx.drawImage(canvas, -SHIFT_PX, 0);

                const w = canvas.width;
                const h = canvas.height;
                const rightEdge = w - SHIFT_PX;

                const nyquist = spectroAudioCtx.sampleRate / 2;
                const maxFreq = getSpectroMaxFreq();
                const usableBins = Math.max(1, Math.min(bufferLength, Math.floor((maxFreq / nyquist) * bufferLength)));

                for (let y = 0; y < h; y++) {
                    const binStart = Math.floor((y / h) * usableBins);
                    const binEnd = Math.max(binStart + 1, Math.floor(((y + 1) / h) * usableBins));
                    let sum = 0;
                    for (let b = binStart; b < binEnd && b < bufferLength; b++) {
                        sum += dataArray[b];
                    }
                    const val = sum / (binEnd - binStart);

                    const r = Math.min(255, Math.round(val));
                    const g = val > 128 ? Math.min(255, Math.round((val - 128) * 2)) : 0;
                    const b = val > 200 ? Math.min(255, Math.round((val - 200) * 4)) : 0;

                    ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                    ctx.fillRect(rightEdge, h - 1 - y, SHIFT_PX, 1);
                }
            }
            spectroReqId = requestAnimationFrame(render);
        }

        // --- URL PARAMETER AUTO-CONFIG (?profile=canary&mode=4fsk&lang=ro) ---

        function applyUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const langParam = (params.get('lang') || '').toLowerCase();
            if (langParam === 'ro' || langParam === 'en') {
                currentLang = langParam;
            }

            const profileParam = (params.get('profile') || '').toLowerCase();
            if (profileParam && PROFILES[profileParam]) {
                document.getElementById('profileSelect').value = profileParam;
            }

            const modeParam = (params.get('mode') || '').toLowerCase();
            if (modeParam) {
                const radio = document.querySelector(`input[name="modMode"][value="${modeParam}"]`);
                if (radio) radio.checked = true;
            }
        }

        // Initialize on load
        applyUrlParams();
        setLanguage(currentLang);
    </script>
</body>
</html>
